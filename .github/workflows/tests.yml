name: Tests y Cobertura

# Se ejecuta automáticamente en cada push y pull request hacia estas ramas.
on:
  push:
    branches:
      - main
      - act4-integracion-continua-aseguramiento-calidad
  pull_request:
    branches:
      - main
      - act4-integracion-continua-aseguramiento-calidad

jobs:
  test:
    name: Suite completa (unitarias, componentes, integración, contrato)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        # --legacy-peer-deps: el proyecto tiene un conflicto de peer
        # dependencies entre react@19.2.3 y react-dom@19.2.8 (dependencias
        # transitivas de expo-router/@radix-ui), no relacionado con esta
        # actividad. npm ci por defecto es estricto con peers y falla; con
        # esta bandera resuelve igual que npm install en local.
        run: npm ci --legacy-peer-deps

      - name: Ejecutar suite de pruebas con cobertura
        # jest.config.js define coverageThreshold en 80% (branches, functions,
        # lines, statements). Si algún porcentaje de cobertura queda por
        # debajo del umbral, `jest` retorna código de salida distinto de 0 y
        # este step (y por lo tanto el job) falla automáticamente.
        run: npm run test:coverage -- --ci

      - name: Subir reporte de cobertura como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14